<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%">
  <defs>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="50%" stop-color="#FF5100" />
      <stop offset="100%" stop-color="#E53900" />
    </linearGradient>
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA040" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FF3D00" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sun Circle -->
  <circle cx="160" cy="98" r="58" fill="url(#sunGradient)" />
  <circle cx="160" cy="98" r="70" fill="url(#sunGlow)" filter="url(#glow)" opacity="0.4" />

  <!-- Architectural 3-Tier Chevron Peak (Front Over Sun) -->
  <!-- Top Tier / Peak -->
  <polygon points="160,24 184,80 160,70 136,80" fill="#0D0E12" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round" />
  <polygon points="160,24 184,80 160,70" fill="#181B22" />
  
  <!-- Middle Tier -->
  <polygon points="160,54 200,108 160,96 120,108" fill="#0D0E12" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round" />
  <polygon points="160,54 200,108 160,96" fill="#1C2028" />

  <!-- Base / Outer Tier -->
  <polygon points="160,78 218,136 160,122 102,136" fill="#0D0E12" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" />
  <polygon points="160,78 218,136 160,122" fill="#222733" />

  <!-- Central Spine Highlight -->
  <line x1="160" y1="24" x2="160" y2="122" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />

  <!-- Typography -->
  <!-- "ASPIRE" -->
  <text x="160" y="196" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="4" fill="#FFFFFF">ASPIRE</text>
  
  <!-- "H O U S I N G" -->
  <text x="160" y="234" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="12" fill="#FF5500">HOUSING</text>
  
  <!-- Subtle Slogan -->
  <text x="160" y="258" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="600" letter-spacing="3" fill="#94A3B8">BUILT ON TRUST. BACKED BY TRANSPARENCY.</text>
</svg>